[package]
name = "suprah"
version = "0.49.4"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.38"
rand = "0.8.5"
once_cell = "1.20.2"
chashmap = "2.2.2"
crossbeam-queue = "0.3.12"
rayon = "1.10.0"

[features]
# Stage-0 opportunity measurement for `task.md` 1.2.2. Off by default; see `src/search_diag.rs`.
search-diag = []
# The Texel tuner (`task.md` 29.5 E2): the evaluation trace and the `texel-*` commands. Off by
# default; the release build compiles none of it.
texel = []
